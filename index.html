<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Unlock My Heart ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at top, #1a1a2e, #000);
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    color: #fff;
}

/* PASSCODE */
#lockScreen {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, #2c2c54, #000);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

#lockScreen input {
    width: 220px;
    padding: 12px;
    font-size: 18px;
    border-radius: 10px;
    border: none;
    text-align: center;
    outline: none;
}

#lockScreen button {
    margin-top: 20px;
    padding: 12px 32px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(135deg, #ff4d6d, #ff758f);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(255,77,109,0.6);
}

/* ERROR + HINT */
#errorMsg, #hintMsg {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 24px;
    border-radius: 30px;
    display: none;
    z-index: 9999;
}

#errorMsg {
    top: 20px;
    background: rgba(255,77,109,0.95);
}

#hintMsg {
    bottom: 90px;
    min-width: 300px;
    max-width: 90%;
    padding: 18px 26px;
    font-size: 20px;
    text-align: center;
    line-height: 1.4;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(8px);
    border-radius: 28px;
    box-shadow: 0 0 22px rgba(255,105,180,0.6);
}

/* SHAKE */
@keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    50% { transform: translateX(6px); }
    75% { transform: translateX(-6px); }
    100% { transform: translateX(0); }
}
.shake { animation: shake 0.4s; }

/* STORY */
#story { display:none; height:100vh; }

.slide {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    width: 100%;
    height: 100vh;
    opacity: 0;
    transition: opacity 1s ease;
}
.slide.active { opacity:1; }

.bg-video {
    width:100%;
    height:100%;
    object-fit:cover;
}

.overlay {
    position:absolute;
    bottom:90px;
    left:20px;
    right:20px;
    font-size:22px;
	color: Black;
}

.swipeHint {
    position:absolute;
    bottom:30px;
    width:100%;
    text-align:center;
    opacity:.7;
}

/* PROPOSAL */
#proposal {
    display:none;
    position:absolute;
    inset:0;
    background: radial-gradient(circle, #1b1b3a, #000);
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

.heart { font-size:70px; animation: beat 1.2s infinite; }
@keyframes beat { 50% { transform:scale(1.2); } }

.buttons {
    margin-top:30px;
    width:300px;
    height:80px;
    position:relative;
}

button.yes, button.no {
    border:none;
    padding:12px 28px;
    border-radius:30px;
    position:absolute;
    color:#fff;
}

button.yes { background:#ff4d6d; left:0; }
button.no { background:#444; right:0; }

.confetti {
    position:fixed;
    width:8px;
    height:14px;
    top:-20px;
    animation: fall 3s linear forwards;
}
@keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity:0; }
}

.name { font-size:42px; color:hotpink; }
.letter { max-width:320px; font-size:20px; line-height:1.6; }
</style>
</head>

<body>

<div id="errorMsg">Wrong code 💔</div>
<div id="hintMsg">💡 Hint: Two birthdays, one heart (Mine + Your's)❤️</div>

<!-- LOCK -->
<div id="lockScreen">
    <h1>🔒 Enter the secret code</h1>
    <input type="password" id="code" placeholder="❤️ ❤️ ❤️">
    <button id="unlockBtn" onclick="unlock()">Unlock</button>
</div>

<!-- Audio Player -->
<audio id="slideMusic"></audio>

<!-- STORY -->
<div id="story" onclick="nextSlide()">
    <div class="slide active" style="background-image:url('images/suppu_5.jpeg')"></div>

    <div class="slide">
        <video autoplay muted loop playsinline class="bg-video">
            <source src="images/suppu_6.mp4" type="video/mp4">
        </video>
    </div>

    <div class="slide">
        <video autoplay muted loop playsinline class="bg-video">
            <source src="images/suppu_7.mp4" type="video/mp4">
        </video>
    </div>

    <div class="slide">
        <video autoplay muted loop playsinline class="bg-video">
            <source src="images/suppu_8.mp4" type="video/mp4">
        </video>
    </div>

    <div class="overlay" id="text"></div>
    <div class="swipeHint">👉 Tap or Swipe</div>
</div>

<!-- PROPOSAL -->
<div id="proposal">
    <div class="heart">💖</div>
    <h1>Will You Be My Valentine?</h1>
    <p>Today, tomorrow, and always 💍</p>
    <div class="buttons">
        <button class="yes" onclick="sayYes()">Yes 💕</button>
        <button class="no" id="noBtn">No 🙈</button>
    </div>
</div>

<script>
const PASSCODE = "2928";
let attempts = 0;

/* MUSIC LIST */
const musicList = [
  "audio/Tujhe_Prem_Majhla_Kalu_Lagle.mp3",
  "audio/Hum_Mar_Jayenge.mp3",
  "audio/Sundara.mp4",
  "audio/Dooron_Dooron.mp3"
];

const slideMusic = document.getElementById("slideMusic");

function playSlideMusic(i) {
    slideMusic.pause();
    slideMusic.currentTime = 0;
    slideMusic.src = musicList[i];
    slideMusic.play().catch(()=>{});
}

/* UNLOCK */
function unlock() {
    const code = document.getElementById("code");
    const error = document.getElementById("errorMsg");
    const hint = document.getElementById("hintMsg");
    const btn = document.getElementById("unlockBtn");

    if (code.value === PASSCODE) {
        document.getElementById("lockScreen").style.display = "none";
        document.getElementById("story").style.display = "block";
        playSlideMusic(0);
        return;
    }

    attempts++;
    if (navigator.vibrate) navigator.vibrate(200);

    code.classList.add("shake");
    setTimeout(()=>code.classList.remove("shake"),400);

    error.style.display="block";
    setTimeout(()=>error.style.display="none",2000);

    if (attempts === 3) hint.style.display="block";

    if (attempts >= 5) {
        btn.disabled = true;
        btn.textContent = "Try harder 😉";
        setTimeout(()=>{
            btn.disabled=false;
            btn.textContent="Unlock";
        },3000);
    }

    code.value="";
    code.focus();
}

/* STORY */
const slides=document.querySelectorAll(".slide");
const text=document.getElementById("text");

const messages=[
"Elegance, grace… and my whole heart. 💖",
"With you, every step feels blessed. 🙏💫",
"Your smile is my favorite celebration. 💛✨",
"Always you. Forever us. 💍💕" -->
];



let index=0;
text.innerText=messages[0];

function nextSlide(){
    index++;
    if(index<slides.length){
        slides.forEach(s=>s.classList.remove("active"));
        slides[index].classList.add("active");
        text.innerText=messages[index];
        playSlideMusic(index);
    } else {
        slideMusic.pause();
        document.getElementById("story").style.display="none";
        document.getElementById("proposal").style.display="flex";
    }
}

/* NO BUTTON */
const noBtn=document.getElementById("noBtn");
noBtn.addEventListener("mouseover",()=> {
    noBtn.style.left=Math.random()*200+"px";
    noBtn.style.top=Math.random()*60+"px";
});

/* YES */
function sayYes(){
    for(let i=0;i<120;i++){
        const c=document.createElement("div");
        c.className="confetti";
        c.style.left=Math.random()*100+"vw";
        c.style.background=`hsl(${Math.random()*360},100%,60%)`;
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),4000);
    }

    document.getElementById("proposal").innerHTML=`
    <div class="heart">💘</div>
    <h1>She Said YES!!!</h1>
    <div class="name">💖 Suppu 💖</div>
    <div class="letter">
    Loving you isn’t a moment, it’s a lifetime decision.
	Today, tomorrow, and every
	forever after… I choose you. 
	Happy Valentine’s Day,
	my forever and always 💍❤️
    </div>`;
}
</script>

</body>
</html>
