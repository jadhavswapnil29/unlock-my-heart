<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Unlock My Heart ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at top, #1a1a2e, #000);
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    color: #fff;
}

/* ---------- PASSCODE ---------- */
#lockScreen {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, #2c2c54, #000);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

#lockScreen input {
    width: 220px;
    padding: 12px;
    font-size: 18px;
    border-radius: 10px;
    border: none;
    text-align: center;
    outline: none;
}

#lockScreen button {
    margin-top: 20px;
    padding: 12px 32px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(135deg, #ff4d6d, #ff758f);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(255,77,109,0.6);
}

/* ---------- ERROR + HINT ---------- */
#errorMsg, #hintMsg {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 24px;
    border-radius: 30px;
    display: none;
    z-index: 9999;
}

#errorMsg {
    top: 20px;
    background: rgba(255,77,109,0.95);
}

#hintMsg {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);

    min-width: 300px;      /* ⬅️ increased size */
    max-width: 90%;
    padding: 18px 26px;    /* ⬅️ more breathing room */

    font-size: 20px;       /* ⬅️ bigger text */
    text-align: center;
    line-height: 1.4;

    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(8px);

    border-radius: 28px;
    box-shadow: 0 0 22px rgba(255,105,180,0.6);

    display: none;
    z-index: 9999;
}


/* ---------- SHAKE ---------- */
@keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    50% { transform: translateX(6px); }
    75% { transform: translateX(-6px); }
    100% { transform: translateX(0); }
}
.shake { animation: shake 0.4s; }

/* ---------- STORY ---------- */
#story { display:none; height:100vh; }
.slide {
    position: absolute;
    inset: 0;

    background-size: cover;        /* ⬅️ fills full screen */
    background-position: center;   /* ⬅️ keeps subject centered */
    background-repeat: no-repeat;

    width: 100%;
    height: 100vh;

    opacity: 0;
    transition: opacity 1s ease;
}
@media (max-width: 768px) {
    .slide {
        background-position: center top;
    }
}

.slide.active { opacity:1; }

.overlay {
    position:absolute;
    bottom:90px;
    left:20px;
    right:20px;
    font-size:22px;
}

.swipeHint {
    position:absolute;
    bottom:30px;
    width:100%;
    text-align:center;
    opacity:.7;
}

/* ---------- PROPOSAL ---------- */
#proposal {
    display:none;
    position:absolute;
    inset:0;
    background: radial-gradient(circle, #1b1b3a, #000);
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

.heart {
    font-size:70px;
    animation: beat 1.2s infinite;
}
@keyframes beat { 50% { transform:scale(1.2); } }

.buttons {
    margin-top:30px;
    width:300px;
    height:80px;
    position:relative;
}

button.yes {
    background:#ff4d6d;
    color:#fff;
    border:none;
    padding:12px 28px;
    border-radius:30px;
    position:absolute;
    left:0;
}
button.no {
    background:#444;
    color:#fff;
    border:none;
    padding:12px 28px;
    border-radius:30px;
    position:absolute;
    right:0;
}

/* ---------- EFFECTS ---------- */
.confetti {
    position:fixed;
    width:8px;
    height:14px;
    top:-20px;
    animation: fall 3s linear forwards;
}
@keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity:0; }
}

.firework {
    position:fixed;
    width:6px;
    height:6px;
    background:gold;
    border-radius:50%;
    animation: explode 1.5s forwards;
}
@keyframes explode {
    to { transform: translate(var(--x),var(--y)) scale(0); opacity:0; }
}

.name { font-size:42px; color:hotpink; }
.letter { max-width:320px; font-size:20px; line-height:1.6; }
</style>
</head>

<body>

<div id="errorMsg">Wrong code 💔</div>
<div id="hintMsg">💡 Hint: Two birthdays, one heart (Mine + Your's)❤️</div>

<!-- 🔒 LOCK -->
<div id="lockScreen">
    <h1>🔒 Enter the secret code</h1>
    <input type="password" id="code" placeholder="❤️ ❤️ ❤️">
    <button id="unlockBtn" onclick="unlock()">Unlock</button>
</div>

<audio id="music" loop>
<source src="https://cdn.pixabay.com/audio/2022/10/25/audio_946b5e58d1.mp3">
</audio>

<!-- STORY -->
<div id="story" onclick="nextSlide()">
    <div class="slide active" style="background-image:url('images/suppu_1.jpg')"></div>
    <div class="slide" style="background-image:url('images/suppu_2.jpg')"></div>
    <div class="slide" style="background-image:url('images/suppu_3.jpg')"></div>
    <div class="slide" style="background-image:url('images/suppu_4.jpg')"></div>
    <div class="overlay" id="text"></div>
    <div class="swipeHint">👉 Tap or Swipe</div>
</div>

<!-- PROPOSAL -->
<div id="proposal">
    <div class="heart">💖</div>
    <h1>Will You Be My Valentine?</h1>
    <p>Today, tomorrow, and always 💍</p>
    <div class="buttons">
        <button class="yes" onclick="sayYes()">Yes 💕</button>
        <button class="no" id="noBtn">No 🙈</button>
    </div>
</div>

<script>
const PASSCODE = "2928";
let attempts = 0;

function unlock() {
    const code = document.getElementById("code");
    const error = document.getElementById("errorMsg");
    const hint = document.getElementById("hintMsg");
    const btn = document.getElementById("unlockBtn");

    if (code.value === PASSCODE) {
        document.getElementById("lockScreen").style.display = "none";
        document.getElementById("story").style.display = "block";
        document.getElementById("music").play();
		hint.style.display="none"
        return;
    }

    attempts++;
    if (navigator.vibrate) navigator.vibrate(200);

    code.classList.add("shake");
    setTimeout(()=>code.classList.remove("shake"),400);

    error.style.display="block";
    setTimeout(()=>error.style.display="none",2000);

    if (attempts === 3) hint.style.display="block";

    if (attempts >= 5) {
        btn.disabled = true;
        btn.textContent = "Try harder 😉";
        setTimeout(()=>{
            btn.disabled=false;
            btn.textContent="Unlock";
        },3000);
    }

    code.value="";
    code.focus();
}

/* STORY */
const slides=document.querySelectorAll(".slide");
const text=document.getElementById("text");
const messages=[
"Every heartbeat of mine whispers your name ❤️",
"In this quiet night, my world lights up because of you 🕯",
"Every moment with you feels magical ✨",
"There’s only one thing left to ask… 💕"
];
let index=0;
text.innerText=messages[0];

function nextSlide(){
    index++;
    if(index<slides.length){
        slides.forEach(s=>s.classList.remove("active"));
        slides[index].classList.add("active");
        text.innerText=messages[index];
    } else {
        document.getElementById("story").style.display="none";
        document.getElementById("proposal").style.display="flex";
    }
}

/* NO BUTTON */
const noBtn=document.getElementById("noBtn");
noBtn.addEventListener("mouseover",()=> {
    noBtn.style.left=Math.random()*200+"px";
    noBtn.style.top=Math.random()*60+"px";
});

/* YES */
function sayYes(){
    for(let i=0;i<120;i++){
        const c=document.createElement("div");
        c.className="confetti";
        c.style.left=Math.random()*100+"vw";
        c.style.background=`hsl(${Math.random()*360},100%,60%)`;
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),4000);
    }

    document.getElementById("proposal").innerHTML=`
    <div class="heart">💘</div>
    <h1>She Said YES!!!</h1>
    <div class="name">💖 Suppu 💖</div>
    <div class="letter">
    From the moment you came into my life,
    everything felt warmer, brighter, better.

    This is not just a Valentine…
    It’s my heart choosing you,
    again and again, forever 💍❤️
    </div>`;
}
</script>

</body>
</html>
